<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>فوال مروة | Marwa Fawal</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        :root {
            --primary: #ff5000; /* لون هنقرستيشن الشهير */
            --secondary: #2d2d2d;
            --bg-gray: #f7f7f7;
        }
        body { 
            font-family: 'Tajawal', sans-serif; 
            background-color: var(--bg-gray);
            color: var(--secondary);
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* تصميم شريط التصنيفات المتحرك */
        .category-pill {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border-bottom: 3px solid transparent;
        }
        .category-pill.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
            font-weight: 900;
            transform: scale(1.05);
        }

        /* بطاقة الوجبة بأسلوب هنقرستيشن */
        .food-card {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            display: flex;
            transition: transform 0.2s;
            border: 1px solid #eee;
            margin-bottom: 12px;
        }
        .food-card:active { transform: scale(0.98); }
        .food-image {
            width: 100px;
            height: 100px;
            object-fit: cover;
            background: #f0f0f0;
            border-radius: 15px;
            margin: 12px;
        }

        /* زر الإضافة + */
        .add-btn {
            width: 32px;
            height: 32px;
            border-radius: 10px;
            background: white;
            color: var(--primary);
            border: 1.5px solid var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            box-shadow: 0 4px 6px -1px rgba(255, 80, 0, 0.1);
        }

        /* سلة المشتريات العائمة */
        .cart-float {
            position: fixed;
            bottom: 30px;
            left: 20px;
            right: 20px;
            background: var(--primary);
            padding: 16px 24px;
            border-radius: 18px;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 10px 25px rgba(255, 80, 0, 0.3);
            z-index: 1000;
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from { transform: translateY(100px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .modal-blur { backdrop-filter: blur(8px); background: rgba(0,0,0,0.5); }
    </style>
</head>
<body class="pb-32">

    <header class="bg-white sticky top-0 z-[100] border-b border-gray-100">
        <div class="p-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 bg-orange-100 rounded-2xl flex items-center justify-center text-orange-600">
                    <i class="fa-solid fa-utensils text-xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-black text-gray-800">فوال مروه</h1>
                    <div class="flex items-center gap-1 text-xs text-green-600 font-bold">
                        <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span>
                        مفتوح الآن
                    </div>
                </div>
            </div>
            <button onclick="checkAuth()" class="text-gray-400 hover:text-orange-500"><i class="fa-solid fa-gear text-xl"></i></button>
        </div>

        <div id="categoryTabs" class="flex gap-6 overflow-x-auto no-scrollbar px-4 pb-2 scroll-smooth">
            </div>
    </header>

    <main class="max-w-md mx-auto p-4">
        <div id="nbrBtn" onclick="openNbrModal()" class="mb-6 bg-gradient-to-l from-orange-500 to-orange-400 p-5 rounded-[25px] text-white shadow-lg relative overflow-hidden">
            <div class="relative z-10">
                <h3 class="font-black text-lg">توصيل جيران حي بدر 🏠</h3>
                <p id="nbrLabel" class="text-xs opacity-90">سجل كجار للحصول على توصيل مجاني</p>
            </div>
            <i class="fa-solid fa-motorcycle absolute -left-4 -bottom-2 text-6xl opacity-20 -rotate-12"></i>
        </div>

        <div id="itemsGrid" class="space-y-1">
            </div>
    </main>

    <div id="floatingCart" onclick="openCartModal()" class="cart-float hidden">
        <div class="flex items-center gap-3">
            <span class="bg-white/20 px-3 py-1 rounded-lg font-bold" id="cartCount">0</span>
            <span class="font-bold">عرض السلة</span>
        </div>
        <span id="floatingTotal" class="text-xl font-black">0﷼</span>
    </div>

    <div id="mainModal" class="fixed inset-0 z-[2000] hidden modal-blur flex items-end sm:items-center justify-center">
        <div class="bg-white w-full max-w-lg rounded-t-[30px] p-6 slide-up overflow-y-auto max-h-[90vh] relative">
            <div class="w-12 h-1.5 bg-gray-200 rounded-full mx-auto mb-6" onclick="closeModal()"></div>
            <div id="modalContent"></div>
        </div>
    </div>

    <script>
        // قاعدة البيانات (كما هي مع إضافة روابط صور اختيارية)
        const DB = {
            "الوجبات": [{id:1, name:"فول سادة", image:"https://images.unsplash.com/photo-1541518763669-27fef04b14ea?w=200", sizes:{s:3, m:4, l:5, local:6}}, {id:2, name:"فول مشكل", image:"https://images.unsplash.com/photo-1541518763669-27fef04b14ea?w=200", sizes:{s:4, m:5, l:6, local:7}}, {id:5, name:"عدس سادة", sizes:{s:3, m:4, l:5, local:6}}, {id:21, name:"فلافل 4 حبة", price:1}],
            "المطبق": [{id:23, name:"مطبق خضار", price:5, image:"https://images.unsplash.com/photo-1601050690597-df056fb36793?w=200"}, {id:24, name:"مطبق مالح", price:5}, {id:33, name:"نوتيلا", price:7}],
            "العريكة والفتة": [{id:34, name:"قشطة عسل", price:12}, {id:36, name:"ملكي", price:16}],
            "المعصوب": [{id:41, name:"قشطة عسل", price:12}, {id:43, name:"ملكي", price:16}],
            "السندوتشات": [{id:48, name:"كبدة", sizes:{samoli:4, fatira:5}}, {id:55, name:"شكشوكة جبن", sizes:{samoli:4, fatira:5}}],
            "التميس": [{id:56, name:"تميس عادي", price:1}, {id:59, name:"تميس جبن", price:5}],
            "المشروبات": [{id:71, name:"ماء", price:1}, {id:74, name:"شاي بالحليب", price:2}]
        };

        let cart = [];
        let isNeighbor = localStorage.getItem('isNbr') === 'true';
        let currentCategory = "الوجبات";

        window.onload = () => {
            renderTabs();
            renderItems();
            updateCartDisplay();
            setNeighborUI();
        };

        function renderTabs() {
            const tabs = document.getElementById('categoryTabs');
            tabs.innerHTML = Object.keys(DB).map(cat => `
                <button onclick="setCategory('${cat}')" class="category-pill whitespace-nowrap py-3 text-sm font-bold ${cat === currentCategory ? 'active' : 'text-gray-400'}">
                    ${cat}
                </button>
            `).join('');
        }

        function setCategory(cat) {
            currentCategory = cat;
            renderTabs();
            renderItems();
        }

        function renderItems() {
            const grid = document.getElementById('itemsGrid');
            grid.innerHTML = DB[currentCategory].map(item => `
                <div class="food-card" onclick="openItemOptions(${item.id})">
                    <img src="${item.image || 'https://via.placeholder.com/100?text=Marwa'}" class="food-image" alt="${item.name}">
                    <div class="flex-1 py-4 pr-1 pl-4 flex flex-col justify-between">
                        <div>
                            <h4 class="font-bold text-gray-800 mb-1">${item.name}</h4>
                            <p class="text-xs text-gray-400 line-clamp-2">أجود المكونات المحضرة يومياً بكل حب في فوال مروه.</p>
                        </div>
                        <div class="flex justify-between items-center">
                            <span class="text-orange-600 font-black">${item.price ? item.price + ' ﷼' : 'خيارات متعددة'}</span>
                            <div class="add-btn"><i class="fa-solid fa-plus"></i></div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function openItemOptions(id) {
            const item = Object.values(DB).flat().find(i => i.id === id);
            let content = `
                <div class="mb-6">
                    <img src="${item.image || 'https://via.placeholder.com/100?text=Marwa'}" class="w-full h-48 object-cover rounded-2xl mb-4">
                    <h2 class="text-2xl font-black">${item.name}</h2>
                    <p class="text-gray-500 text-sm mt-1">اختر الحجم أو الإضافات المفضلة لديك</p>
                </div>
            `;

            if (item.sizes) {
                content += `<div class="space-y-3">
                    ${Object.entries(item.sizes).filter(([s]) => isNeighbor ? s !== 'local' : true).map(([s, p]) => `
                        <div class="flex justify-between items-center p-4 border border-gray-100 rounded-2xl hover:bg-orange-50 transition-colors" onclick="updateQty(${item.id}, 1, '${item.name}', ${p}, '${s}'); closeModal();">
                            <span class="font-bold text-gray-700">${getSizeName(s)}</span>
                            <span class="text-orange-600 font-black">${p} ﷼</span>
                        </div>
                    `).join('')}
                </div>`;
            } else {
                content += `
                    <button onclick="updateQty(${item.id}, 1, '${item.name}', ${item.price}); closeModal();" class="w-full bg-orange-500 text-white py-4 rounded-2xl font-black text-lg shadow-lg">
                        إضافة للسلة - ${item.price} ﷼
                    </button>
                `;
            }

            openModalLogic(content);
        }

        function updateQty(id, delta, name, price, size = 'default') {
            const key = `${id}-${size}`;
            const idx = cart.findIndex(i => i.key === key);
            if (idx > -1) {
                cart[idx].qty += delta;
                if (cart[idx].qty <= 0) cart.splice(idx, 1);
            } else if (delta > 0) {
                cart.push({ id, key, name: size !== 'default' ? `${name} (${getSizeName(size)})` : name, price, qty: 1, size, note: '' });
            }
            updateCartDisplay();
        }

        function updateCartDisplay() {
            const count = cart.reduce((s, i) => s + i.qty, 0);
            const total = cart.reduce((s, i) => s + (i.price * i.qty), 0);
            const floatBtn = document.getElementById('floatingCart');
            
            if (count > 0) {
                floatBtn.classList.remove('hidden');
                document.getElementById('cartCount').innerText = count;
                document.getElementById('floatingTotal').innerText = total + " ﷼";
            } else {
                floatBtn.classList.add('hidden');
            }
        }

        // --- وظائف مساعدة ---
        function openModalLogic(content) {
            document.getElementById('modalContent').innerHTML = content;
            document.getElementById('mainModal').classList.remove('hidden');
        }
        function closeModal() { document.getElementById('mainModal').classList.add('hidden'); }
        function getSizeName(s) { return {s:'صغير', m:'وسط', l:'كبير', local:'محلي', samoli:'صامولي', fatira:'فطيرة'}[s] || s; }

        function openCartModal() {
            const total = cart.reduce((s, i) => s + (i.price * i.qty), 0);
            let content = `
                <h2 class="text-xl font-black mb-6">سلة الطلبات 🛒</h2>
                <div class="space-y-4 mb-8">
                    ${cart.map((i, index) => `
                        <div class="flex justify-between items-center bg-gray-50 p-4 rounded-2xl">
                            <div>
                                <h4 class="font-bold text-sm">${i.name}</h4>
                                <p class="text-orange-600 font-black text-xs">${i.price * i.qty} ﷼</p>
                            </div>
                            <div class="flex items-center gap-3">
                                <button onclick="updateQty(${i.id}, -1, '', 0, '${i.size}'); openCartModal()" class="w-8 h-8 bg-white text-red-500 rounded-lg shadow-sm font-black">-</button>
                                <span class="font-black">${i.qty}</span>
                                <button onclick="updateQty(${i.id}, 1, '', 0, '${i.size}'); openCartModal()" class="w-8 h-8 bg-white text-green-500 rounded-lg shadow-sm font-black">+</button>
                            </div>
                        </div>
                    `).join('')}
                </div>
                <div class="flex justify-between items-center mb-6 border-t pt-4">
                    <span class="font-bold text-gray-400">الإجمالي</span>
                    <span class="text-2xl font-black text-gray-800">${total} ﷼</span>
                </div>
                <button onclick="confirmAndSend()" class="w-full bg-orange-500 text-white py-5 rounded-2xl font-black text-lg shadow-xl flex items-center justify-center gap-3">
                    اتمام الطلب (واتساب)
                </button>
            `;
            openModalLogic(content);
        }

        function confirmAndSend() {
            const now = new Date();
            const orderID = Math.random().toString(36).substr(2, 6).toUpperCase();
            let msg = `*طلب جديد - فوال مروه*%0AID: ${orderID}%0A`;
            cart.forEach(i => { msg += `• ${i.name} [${i.qty}] = ${i.price * i.qty}﷼%0A`; });
            msg += `%0A💰 *الإجمالي: ${cart.reduce((s,i)=>s+(i.price*i.qty),0)}﷼*`;
            window.location.href = `https://wa.me/966530195433?text=${msg}`;
        }

        function setNeighborUI() {
            const isN = localStorage.getItem('isNbr') === 'true';
            const btn = document.getElementById('nbrBtn');
            if(isN) {
                btn.classList.replace('from-orange-500', 'from-green-500');
                btn.classList.replace('to-orange-400', 'to-green-400');
                document.getElementById('nbrLabel').innerText = "تم تفعيل التوصيل المجاني ✅";
            }
        }

        function openNbrModal() {
            openModalLogic(`
                <div class="text-center">
                    <h2 class="text-2xl font-black mb-4">كود حي بدر</h2>
                    <input type="text" id="nbrInput" placeholder="أدخل كود الجيران" class="w-full p-4 bg-gray-100 rounded-xl mb-4 text-center font-bold outline-none border-2 border-transparent focus:border-orange-500">
                    <button onclick="verifyNbr()" class="w-full bg-black text-white py-4 rounded-xl font-bold">تفعيل</button>
                </div>
            `);
        }

        function verifyNbr() {
            if(document.getElementById('nbrInput').value === "حي بدر") {
                localStorage.setItem('isNbr', 'true');
                location.reload();
            } else { alert("الكود خاطئ"); }
        }
    </script>
</body>
</html>
